[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-tacacs-appliance"
version = "1.1.6"
description = "Offline-first TACACS+ AAA appliance"
requires-python = ">=3.12"
dependencies = ["argon2-cffi>=23.1,<26", "psycopg[binary,pool]>=3.2,<4", "cryptography>=46,<51"]

[project.optional-dependencies]
test = ["cryptography>=46,<51"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tacacs_appliance = ["console/*.html", "console/*.css", "console/*.js", "console/login-tnac.svg"]
